    el('td', {}, c.refs.map(([t, n]) => el('span', { class: `ref ${t}`, text: n })), c.subject),
    el('td', { text: c.date }),
    el('td', { text: c.author }),
    el('td', { class: 'mono', text: short(c.hash) })
  ));

  const tree = el('div', { class: 'tree-wrap' },
    el('table', { class: 'tree', role: 'grid', 'aria-label': 'Histórico de commits' },
      el('colgroup', {}, el('col', { style: 'width:90px' }), el('col'), el('col', { style: 'width:130px' }), el('col', { style: 'width:150px' }), el('col', { style: 'width:80px' })),
      el('thead', {}, el('tr', {}, ['Graph', 'Descripción', 'Fecha', 'Autor', 'Commit'].map(t => el('th', { scope: 'col', text: t })))),
      el('tbody', {}, rows)));

  const filters = el('div', { class: 'filters' },
    el('label', { class: 'sr-only', for: 'fBranch', text: 'Ramas' }),
    el('select', { id: 'fBranch' }, el('option', { text: 'All Branches' }), el('option', { text: 'Current Branch' })),
    el('label', {}, el('input', { type: 'checkbox', checked: true }), ' Show Remote Branches'),
    el('span', { style: 'flex:1' }),
    el('label', { class: 'sr-only', for: 'fAuthor', text: 'Filtrar por autor' }),
    el('input', { id: 'fAuthor', type: 'search', placeholder: 'Author Name' }));

  const wrap = el('div', { class: 'history' + (state.commit ? ' has-detail' : '') },
    el('div', { style: 'display:flex;flex-direction:column;min-height:0' }, filters, tree),
    state.commit ? commitDetail(state.commit, false) : null);
  return wrap;
}

/** Commit detail block, reused in history (bottom) and changes (left) modes. */
function commitDetail(c, inSplit) {
  const files = el('ul', { class: 'files', role: 'listbox', 'aria-label': 'Archivos del commit' },
    c.files.map(f => el('li', {}, el('button', {
      type: 'button', role: 'option',
      'aria-selected': inSplit && state.file === f ? 'true' : 'false',
      onclick: () => { state.file = f; if (!inSplit) state.mode = 'changes'; render(); }
    }, statusBadge(f[0]), el('span', { class: 'mono', text: f[1] })))));

  const head = el('div', { class: 'detail-head' },
    el('span', { class: 'title', text: `Commit ${short(c.hash)}` }),
    inSplit
      ? null
      : el('button', { type: 'button', class: 'primary', onclick: openChanges, title: 'Abrir visor de cambios (Enter)' }, 'Ver cambios →'),
    inSplit ? null : el('button', { type: 'button', class: 'ghost', onclick: () => { state.commit = null; render(); }, title: 'Cerrar detalle' }, '✕'));

  return el('section', { class: 'detail', 'aria-label': 'Detalle del commit' },
    head,
    el('div', { class: 'detail-body' },
      el('div', {},
        el('dl', { class: 'meta' },
          el('div', {}, el('dt', { text: 'Commit: ' }), el('dd', { class: 'mono', text: `${c.hash} [${short(c.hash)}]` })),
          el('div', {}, el('dt', { text: 'Parents: ' }), el('dd', { class: 'mono hash', text: c.parents })),
          el('div', {}, el('dt', { text: 'Author: ' }), el('dd', { text: `${c.author} <${c.email}>` })),
          el('div', {}, el('dt', { text: 'Date: ' }), el('dd', { text: c.date }))),
        el('div', { class: 'msg', text: c.subject + (c.body ? '\n\n' + c.body : '') })),
      el('div', { class: 'avatar', role: 'img', 'aria-label': `Avatar de ${c.author}` })),
    files);
}

/** Diff viewer; optional back button returns to the history list. */
function diffViewer(file, withBack) {
  const head = el('div', { class: 'diff-head' },
    withBack ? el('button', { type: 'button', onclick: backToHistory, title: 'Volver al histórico (Esc)' }, '← Volver al histórico') : null,
    file ? statusBadge(file[0]) : null,
    el('span', { class: 'path mono', text: file ? file[1] : '' }),
    el('button', { type: 'button', title: 'Opciones de diff' }, '⚙'));

  if (!file) return el('section', { class: 'diff', 'aria-label': 'Visor de cambios' }, head, el('div', { class: 'empty', text: 'Selecciona un archivo de la izquierda para ver sus cambios.' }));

  const hunks = fileDiff(file).map(h => el('div', {},
    el('div', { class: 'hunk-h' }, el('span', { text: h.title }), el('button', { type: 'button' }, 'Reverse hunk')),
    el('table', { class: 'code' }, el('tbody', {}, h.lines.map(([t, o, n, txt]) =>
      el('tr', { class: { a: 'add', d: 'del', c: '' }[t] },
        el('td', { class: 'ln', text: o }), el('td', { class: 'ln', text: n }),
        el('td', { text: (t === 'a' ? '+ ' : t === 'd' ? '- ' : '  ') + txt })))))));

  return el('section', { class: 'diff', 'aria-label': 'Visor de cambios' }, head, el('div', { class: 'diff-scroll' }, hunks));
}

/** Changes mode: commit detail moves left, diff viewer on the right. */
function renderChanges() {
  return el('div', { class: 'split' }, commitDetail(state.commit, true), diffViewer(state.file, true));
}

/** File Status: working copy (image 2) on the left, diff viewer on the right. */
function renderStatus() {
  const list = (items, staged) => el('ul', { class: 'files', 'aria-label': staged ? 'Cambios preparados' : 'Cambios' },
    items.map(f => el('li', {},
      el('button', { type: 'button', class: 'file', 'aria-selected': state.statusFile === f ? 'true' : 'false', onclick: () => { state.statusFile = f; render(); } },
        statusBadge(f[0]), el('span', { class: 'mono', text: f[1].split('/').pop() }), el('span', { style: 'color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis', text: f[1] })),
      el('button', { type: 'button', class: 'act ghost', title: staged ? 'Unstage' : 'Stage', onclick: () => toggleStage(f, staged) }, staged ? '−' : '+'))));

  const left = el('section', { class: 'status', 'aria-label': 'Estado de archivos' },
    el('div', { class: 'commit-box' },
      el('label', { class: 'sr-only', for: 'commitMsg', text: 'Mensaje de commit' }),
      el('textarea', { id: 'commitMsg', placeholder: `Mensaje (Ctrl+Enter para commit en "${currentBranch}")` }),
      el('button', { type: 'button', class: 'primary' }, '✓ Commit')),
    el('h3', {}, 'Staged Changes', el('span', { class: 'badge', text: workingCopy.staged.length })),
    list(workingCopy.staged, true),
    el('h3', {}, 'Changes', el('span', { class: 'badge', text: workingCopy.unstaged.length })),
    list(workingCopy.unstaged, false));

  return el('div', { class: 'split' }, left, diffViewer(state.statusFile, false));
}

// ---- Actions -----------------------------------------------------------
function selectCommit(c) { state.commit = c; state.file = null; render(); }
function openChanges() {
  if (!state.commit) return;
  state.mode = 'changes';
  state.file = state.file || state.commit.files[0];
  render();
}
function backToHistory() { state.mode = 'list'; render(); document.querySelector('tr.row[aria-selected="true"]')?.focus(); }
function toggleStage(f, staged) {
  const [from, to] = staged ? [workingCopy.staged, workingCopy.unstaged] : [workingCopy.unstaged, workingCopy.staged];
  from.splice(from.indexOf(f), 1); to.push(f); render();
}

// ---- Repos panel (pinnable) --------------------------------------------
const reposEl = document.getElementById('repos');
function renderRepos(filter = '') {
  const ul = document.getElementById('repoList');
  ul.replaceChildren(...repos.filter(r => r.name.toLowerCase().includes(filter.toLowerCase())).map(r =>
    el('li', {}, el('button', {
      type: 'button', 'aria-current': r.name === document.getElementById('repoTitle').textContent ? 'true' : 'false',
      onclick: () => { document.getElementById('repoTitle').textContent = r.name; if (!state.reposPinned) setRepos(false); renderRepos(filter); }
    }, el('span', { class: 'rname', text: r.name }), el('span', { class: 'rsub' }, el('span', { class: 'b', text: r.branch }), el('span', { text: r.path }))))));
}
function setRepos(open) {
  state.reposOpen = open;
  reposEl.classList.toggle('open', open || state.reposPinned);
  reposEl.classList.toggle('floating', !state.reposPinned);
  document.getElementById('reposToggle').setAttribute('aria-pressed', String(open || state.reposPinned));
  if (open && !state.reposPinned) document.getElementById('repoSearch').focus();
}
document.getElementById('reposToggle').addEventListener('click', () => {
  if (state.reposPinned) { state.reposPinned = false; document.getElementById('pinBtn').setAttribute('aria-pressed', 'false'); setRepos(false); }
  else setRepos(!state.reposOpen);
});
document.getElementById('reposClose').addEventListener('click', () => { state.reposPinned = false; document.getElementById('pinBtn').setAttribute('aria-pressed', 'false'); setRepos(false); });
document.getElementById('pinBtn').addEventListener('click', (e) => {
  state.reposPinned = !state.reposPinned;
  e.currentTarget.setAttribute('aria-pressed', String(state.reposPinned));
  setRepos(true);
});
document.getElementById('repoSearch').addEventListener('input', (e) => renderRepos(e.target.value));
document.addEventListener('click', (e) => {
  if (state.reposOpen && !state.reposPinned && !reposEl.contains(e.target) && !e.target.closest('#reposToggle')) setRepos(false);
});

// ---- Sidebar + global keys ---------------------------------------------
document.getElementById('branches').append(...branches.map(b => el('li', {}, el('button', { type: 'button', class: b === currentBranch ? 'branch-current current' : '' }, b))));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { state.view = b.dataset.view; render(); }));
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (state.reposOpen && !state.reposPinned) setRepos(false);
  else if (state.view === 'history' && state.mode === 'changes') backToHistory();
});

// ---- Render ------------------------------------------------------------
function render() {
  document.querySelectorAll('[data-view]').forEach(b => b.dataset.view === state.view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  const main = document.getElementById('main');
  main.replaceChildren(
    state.view === 'status' ? renderStatus()
      : state.mode === 'changes' && state.commit ? renderChanges()
      : renderHistory());
}

renderRepos();
render();
</script>
</body>
</html>
